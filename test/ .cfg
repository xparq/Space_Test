#-----------------------------------------------------------------------------
# Space Test Config 0.30.0
#
# This is an .sh (BusyBox ash) script. Please don't leave the designated area.
# - Keep the `export`s.
# - Keep the quotes.
# - No spaces around the "=", unfortunately.
#-----------------------------------------------------------------------------
# Verbose internals (but test scripts can also use the `DEBUG ...` conditional echo):
export SPACE_DEBUG=1
	# Default: not set -> `DEBUG ...` does nothing.

# Main test executable (and its matching .cpp source) filename (with no suffix):
export TEST_NAME="test-demo"
	# Default: test
	#!!Now, here spaces are NOT YET SUPPORTED!... -> #25


#-----------------------------------------------------------------------------
# Test-case auto-build...
#-----------------------------------------------------------------------------

# Toolset for building stuff:
# Default: not set -> autodetect
#export TOOLSET=msvc
#export TOOLSET=gcc
#!! SUBSETS ARE NOT YET SUPPORTED:
#export TOOLSET=gcc/64devkit
#export TOOLSET=gcc/...

# Preferred make tool/flavor (only these two yet!):
# Default: not set -> autodetect
#export MAKE=nmake
#export MAKE=gnumake

# MSVC:
#export _CFLAGS_MSVC="-Zi -MTd"  # extras to add first...
 export  CFLAGS_MSVC="-std:c++latest -W4 -wd4100 -EHsc -Zc:preprocessor"
#export  CFLAGS_MSVC_="-Wall"    # ...extras to add last
# GCC:
#export _CFLAGS_GCC="-g"
 export  CFLAGS_GCC="-std=c++2b -Wall -Wextra"
 export  CFLAGS_GCC_="-pedantic -Wconversion -Wsign-conversion -Wformat-signedness -Wtype-limits -Wchar-subscripts"

# Extra include paths for test case builds
#!! Except... Due to the : vs. ; sep. diff., the GCC ones can only work on EITHER Windows, OR POSIX!... :-/
#!! See also at PATH=...! Clients need to manually set conditionally by platform, until Space Test
#!! itself can provide a $TEST_PATH_LIST_SEP... -> #100 But even then: path roots are still set
#!! differently!... Maybe #100 should do a full path-conv, like PATH=`st_pathlist posix:path:list`?!
#! Note: $TEST_DIR and its parent are added (first) internally, to ease the path
#!       convertion burden at least that much...
#export INCLUDE="...;$INCLUDE"
export CPATH="" #"...:$CPATH"
#! NOTE: These are "system include paths": GCC/Clang disables a bunch of warnings for sources there!... :-o
#export C_INCLUDE_PATH="...:$C_INCLUDE_PATH"
#export CPLUS_INCLUDE_PATH="...:$CPLUS_INCLUDE_PATH"

# Common build dependencies (relative to the test dir; the stock makefile(s)
# will just glue this to the test case target's implied local dependencies):
# Be careful not to add wildcards too eagerly, as nonexistent matches would break the build!
# Put it in quotes if it doesn't seem to work! ;)
#!!Spaces in filenames are not yet supported here! -> #42
#!!Even worse: there can only be a single dependency item yet, as TEST_DIR will get prepended to it! :-/ -> #43
export BUILD_DEPS_COMMON=*.hpp
	# Default: ""


#-----------------------------------------------------------------------------
# Test runner behavior...
#-----------------------------------------------------------------------------

#!! Well, some POSIX emu envs (mainly: Git bash) may use incompatible path
#!! conversions for $PATH (/c/...), vs. $TEST_DIR (C:/...), so no use trying
#!! this... :-/ Good luck even figuring out the correct separator (: or ;)...
#!! E.g. BusyBox-w32 worked fine with this, though:
#!!export PATH="$TEST_DIR:$PATH"

# This would disable auto-prefixing cmd filenames for RUN with ./ to allow
# PATH lookup, which may be better done per test case than here globally.
# (If extending the PATH (above) worked, this would be much more of a handy
# feature though.)
#export RUN_WITH_PATH_LOOKUP=1


#-----------------------------------------------------------------------------
# Compatibility wiring options for older test sets...
#-----------------------------------------------------------------------------

# Name of the test script file in a TC dir:
#TEST_CASE_SCRIPT_NAME=TEST.sh
	# Default: SCRIPT
# For single-file TCs, recognize them by this filename suffix:
#TEST_CASE_FILE_EXT=.tc.sh
	# Default: .case
#EXPECT_FILE_NAME=expected.out
	# Default: EXPECT
